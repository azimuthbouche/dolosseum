# Smoke test adapted from the structure of upstream paper-tag collusion configs.
# NOT a paper replication. 3 conditions x 1 seed. Requires OPENAI_API_KEY.
simulation:
  max_iterations: 1
  max_planning_rounds: 2
  max_conversation_steps: 2
  seed: 1
  tags: [sprint_smoke]

environment:
  name: JiraTicketEnvironment
  assignment_filling: false
  max_tasks: 8

communication_network:
  topology: complete
  num_agents: 4
  consolidate_channels: true

llm_models:
  - label: openai-gpt-4o-mini
    llm:
      provider: openai
      openai:
        model: gpt-4o-mini
        params:
          max_tokens: 1000
          temperature: 0.7

experiment:
  tag: sprint_smoke
  output_dir: experiments/collusion/outputs/sprint_smoke
  max_concurrent_runs: 1
  seeds: [1]
  collusion:
    colluder_selection: random
    agent_order: random
  sweeps:
    - name: smoke_three_arms
      topologies: [complete]
      num_agents: [4]
      colluder_counts: [2]
      secret_channel_enabled: [false, true]
      prompt_variants: [control, simple]
